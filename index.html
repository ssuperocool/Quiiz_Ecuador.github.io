<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ruta Ecuador · Reto de Cultura General</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night: #123527;
    --night-deep: #0b241a;
    --cream: #fbf3df;
    --sun: #f2b705;
    --coral: #e4572e;
    --sky: #2e86ab;
    --leaf: #4f9d5d;
    --line: rgba(251,243,223,0.14);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body{
    margin:0; min-height:100vh; font-family:'Nunito', sans-serif; color: var(--cream);
    background:
      radial-gradient(circle at 20% 0%, rgba(46,134,171,0.25), transparent 50%),
      radial-gradient(circle at 90% 90%, rgba(242,183,5,0.12), transparent 55%),
      var(--night);
    padding: 18px 16px 50px;
  }
  .wrap{ max-width: 460px; margin: 0 auto; }

  header{ text-align:center; margin-bottom:18px; }
  .eyebrow{ font-family:'Space Mono', monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color: var(--sun); margin-bottom:6px;}
  h1{ font-family:'Fredoka', sans-serif; font-weight:700; font-size: 30px; margin:0 0 6px; }
  .subtitle{ font-size:13px; color: rgba(251,243,223,0.75); margin:0; }

  .card{
    background: var(--night-deep); border:1px solid var(--line); border-radius:18px;
    padding: 22px 20px; margin-bottom: 16px;
  }

  /* Start screen */
  input[type=text]{
    width:100%; background: var(--night); border:1px solid var(--line); color: var(--cream);
    padding:13px 16px; border-radius:12px; font-family:'Nunito'; font-size:16px; margin-bottom:14px;
  }
  input[type=text]:focus{ outline:2px solid var(--sun); outline-offset:1px; }
  button{
    font-family:'Fredoka', sans-serif; font-weight:600; border:none; border-radius:14px;
    cursor:pointer; transition: transform .12s ease, filter .12s ease;
  }
  button:active{ transform: scale(0.96); }
  button:hover{ filter:brightness(1.08); }
  .btn-main{ width:100%; background: var(--sun); color: var(--night-deep); padding:16px; font-size:17px; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color: var(--cream); padding:10px 16px; font-size:13px; }

  /* Route progress */
  .route{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:18px; position:relative; }
  .route::before{
    content:''; position:absolute; left:6%; right:6%; top:16px; height:3px;
    background: repeating-linear-gradient(90deg, var(--sun) 0 6px, transparent 6px 12px); z-index:0;
  }
  .stop{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:5px; flex:1; }
  .stop .icon{
    width:34px; height:34px; border-radius:50%; background: var(--night); border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center;
  }
  .stop.active .icon{ background: var(--coral); border-color: var(--coral); }
  .stop.done .icon{ background: var(--leaf); border-color: var(--leaf); }
  .stop .name{ font-size:10px; color: rgba(251,243,223,0.7); font-family:'Space Mono'; }
  .stop.active .name{ color: var(--cream); }
  .stop svg{ width:18px; height:18px; }

  /* Question */
  .qmeta{ display:flex; justify-content:space-between; font-family:'Space Mono', monospace; font-size:12px; color: rgba(251,243,223,0.6); margin-bottom:10px; }
  .qtext{ font-family:'Fredoka', sans-serif; font-size:19px; font-weight:600; line-height:1.35; margin-bottom:18px; }
  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt{
    text-align:left; background: var(--night); border:1px solid var(--line); color: var(--cream);
    padding:13px 16px; border-radius:12px; font-family:'Nunito'; font-size:15px; font-weight:600;
  }
  .opt.correct{ background: var(--leaf); border-color: var(--leaf); color: var(--night-deep); }
  .opt.wrong{ background: var(--coral); border-color: var(--coral); color: var(--cream); }
  .opt[disabled]{ cursor:default; }
  .feedback{ margin-top:12px; font-size:13px; color: rgba(251,243,223,0.75); min-height:18px; }

  .scorebar{ display:flex; justify-content:space-between; align-items:center; font-family:'Space Mono', monospace; font-size:13px; margin-bottom:14px; }
  .scorebar .pts{ color: var(--sun); font-weight:700; font-size:18px; }

  /* End screen */
  .rank-badge{ text-align:center; padding: 10px 0 6px; }
  .rank-title{ font-family:'Fredoka', sans-serif; font-size:24px; color: var(--sun); margin: 6px 0 2px; }
  .rank-desc{ font-size:13px; color: rgba(251,243,223,0.7); margin-bottom:18px; }
  .stat-row{ display:flex; justify-content:space-around; text-align:center; margin-bottom: 18px; }
  .stat-row div span{ display:block; font-family:'Space Mono'; font-size:22px; color: var(--sun); }
  .stat-row div small{ font-size:11px; color: rgba(251,243,223,0.6); }

  /* Leaderboard */
  .lb-toggle{
    position: fixed; bottom: 18px; right: 18px; z-index:5; background: var(--sun); color: var(--night-deep);
    border:none; border-radius: 30px; padding: 12px 18px; font-family:'Fredoka'; font-weight:600;
    font-size:14px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); cursor:pointer;
  }
  .lb-panel{
    position: fixed; inset:0; background: rgba(11,36,26,0.94); z-index:10; display:none;
    padding: 24px 18px; overflow-y:auto;
  }
  .lb-panel.open{ display:block; }
  .lb-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .lb-head h2{ font-family:'Fredoka'; font-size:20px; margin:0; }
  .lb-row{ display:flex; align-items:center; gap:10px; padding:10px 12px; background: var(--night-deep); border:1px solid var(--line); border-radius:12px; margin-bottom:8px; max-width:460px; }
  .lb-rank{ font-family:'Space Mono'; color: var(--sun); width:22px; }
  .lb-name{ flex:1; font-weight:700; }
  .lb-pts{ font-family:'Space Mono'; color: var(--sun); }
  .offline-note{ font-size:12px; text-align:center; color: rgba(251,243,223,0.55); margin-top: 10px; }

  .hidden{ display:none !important; }
  footer{ text-align:center; font-size:11px; color: rgba(251,243,223,0.4); margin-top:24px; font-family:'Space Mono'; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Estudios Sociales · 7mo de Básica</div>
    <h1>Ruta Ecuador</h1>
    <p class="subtitle">Recorre las 4 regiones respondiendo preguntas de cultura general.</p>
  </header>

  <!-- START -->
  <div class="card" id="startScreen">
    <input type="text" id="nameInput" placeholder="Escribe tu nombre" maxlength="24">
    <button class="btn-main" onclick="startGame()">Empezar la ruta</button>
    <div style="text-align:center; margin-top:12px;">
      <button class="btn-ghost" onclick="openQR()">📱 Mostrar QR para el curso</button>
    </div>
  </div>

  <!-- GAME -->
  <div id="gameScreen" class="hidden">
    <div class="card">
      <div class="route" id="route"></div>
      <div class="scorebar">
        <span id="playerLabel"></span>
        <span class="pts" id="pointsLabel">0 pts</span>
      </div>
      <div class="qmeta"><span id="qCounter"></span><span id="qRegion"></span></div>
      <div class="qtext" id="qText"></div>
      <div class="options" id="optionsBox"></div>
      <div class="feedback" id="feedback"></div>
    </div>
  </div>

  <!-- END -->
  <div id="endScreen" class="hidden">
    <div class="card">
      <div class="rank-badge">
        <div class="rank-title" id="rankTitle"></div>
        <div class="rank-desc" id="rankDesc"></div>
      </div>
      <div class="stat-row">
        <div><span id="finalCorrect"></span><small>correctas</small></div>
        <div><span id="finalPoints"></span><small>puntos</small></div>
      </div>
      <button class="btn-main" onclick="location.reload()">Jugar otra vez</button>
      <div style="text-align:center; margin-top:10px;">
        <button class="btn-ghost" onclick="openLeaderboard()">Ver marcador de la clase</button>
      </div>
    </div>
  </div>

  <footer>Dinámica digital de gamificación · Estudios Sociales</footer>
</div>

<button class="lb-toggle" id="lbToggle" onclick="openLeaderboard()">🏆 Marcador</button>
<div class="lb-panel" id="lbPanel">
  <div class="lb-head"><h2>Marcador de la clase</h2><button class="btn-ghost" onclick="closeLeaderboard()">Cerrar</button></div>
  <div id="lbList"></div>
  <div class="offline-note" id="offlineNote"></div>
</div>

<div class="lb-panel" id="qrPanel">
  <div class="lb-head"><h2>Escanea para jugar</h2><button class="btn-ghost" onclick="closeQR()">Cerrar</button></div>
  <div style="display:flex; justify-content:center; margin: 20px 0;">
    <div id="qrBox" style="background:#fff; padding:16px; border-radius:16px;"></div>
  </div>
  <p class="offline-note" style="word-break:break-all;" id="qrUrlText"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
const ICONS = {
  costa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 15c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2"/><path d="M2 19c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2"/></svg>',
  sierra:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 19 9 8l4 6 2-3 6 8Z"/></svg>',
  amazonia:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3c3 3 3 7 0 10-3-3-3-7 0-10Z"/><path d="M12 13v8"/></svg>',
  insular:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="10" r="5"/><path d="M4 19c2-2 4-2 8-2s6 0 8 2"/></svg>'
};
const REGIONS = [
  {id:'costa', label:'Costa'},
  {id:'sierra', label:'Sierra'},
  {id:'amazonia', label:'Amazonía'},
  {id:'insular', label:'Insular'}
];

const POOL = [
  {region:'sierra', q:"¿Cuál es la capital del Ecuador?", opts:["Guayaquil","Quito","Cuenca","Loja"], correct:1},
  {region:'sierra', q:"¿Cuál es el pico más alto del Ecuador?", opts:["Cotopaxi","Cayambe","Chimborazo","Antisana"], correct:2},
  {region:'sierra', q:"¿Qué cordillera atraviesa el Ecuador de norte a sur?", opts:["Los Andes","Los Alpes","El Himalaya","Los Urales"], correct:0},
  {region:'sierra', q:"¿En qué fecha se conmemora el Primer Grito de Independencia en Quito?", opts:["24 de mayo","10 de agosto","9 de octubre","3 de noviembre"], correct:1},
  {region:'sierra', q:"¿Quién es reconocido como precursor de la independencia, científico y periodista quiteño?", opts:["Eugenio Espejo","Simón Bolívar","Antonio José de Sucre","Vicente Rocafuerte"], correct:0},
  {region:'sierra', q:"¿Qué batalla selló la independencia de Quito en 1822?", opts:["Batalla de Boyacá","Batalla de Pichincha","Batalla de Ayacucho","Batalla de Carabobo"], correct:1},
  {region:'costa', q:"¿Qué océano baña las costas del Ecuador?", opts:["Atlántico","Índico","Pacífico","Ártico"], correct:2},
  {region:'costa', q:"¿Qué cultura preincaica, muy antigua de América, se asentó en la costa ecuatoriana?", opts:["Valdivia","Maya","Azteca","Chibcha"], correct:0},
  {region:'costa', q:"¿Cuál es la ciudad más poblada del Ecuador?", opts:["Quito","Cuenca","Guayaquil","Ambato"], correct:2},
  {region:'costa', q:"¿Cuál es uno de los principales productos agrícolas de exportación del Ecuador?", opts:["Banano","Trigo","Aceitunas","Café de altura árabe"], correct:0},
  {region:'costa', q:"¿Qué línea imaginaria le da su nombre al Ecuador?", opts:["El Trópico de Cáncer","La línea ecuatorial","El meridiano de Greenwich","El Círculo Polar"], correct:1},
  {region:'costa', q:"¿Cuál es la moneda oficial del Ecuador desde el año 2000?", opts:["El sucre","El dólar estadounidense","El sol peruano","El peso"], correct:1},
  {region:'amazonia', q:"¿Cuál es el río más largo de Sudamérica, que nace en la región amazónica?", opts:["Río Guayas","Río Napo","Río Amazonas","Río Orinoco"], correct:2},
  {region:'amazonia', q:"¿A qué continente pertenece el Ecuador?", opts:["América del Norte","América del Sur","Europa","África"], correct:1},
  {region:'amazonia', q:"¿Qué idioma indígena es uno de los más hablados en el Ecuador junto al español?", opts:["Kichwa","Náhuatl","Guaraní","Maya"], correct:0},
  {region:'amazonia', q:"¿Qué país limita con Ecuador al norte?", opts:["Perú","Colombia","Brasil","Panamá"], correct:1},
  {region:'amazonia', q:"¿Qué país limita con Ecuador al sur y al este?", opts:["Chile","Bolivia","Perú","Venezuela"], correct:2},
  {region:'amazonia', q:"¿Cuántas regiones naturales tiene continentalmente e insularmente el Ecuador?", opts:["Dos","Tres","Cuatro","Cinco"], correct:2},
  {region:'insular', q:"¿En qué región natural se encuentran las Islas Galápagos?", opts:["Costa","Sierra","Amazonía","Insular"], correct:3},
  {region:'insular', q:"¿Cuál es la provincia insular del Ecuador?", opts:["Galápagos","Esmeraldas","Manabí","Los Ríos"], correct:0},
  {region:'insular', q:"¿Qué pueblo indígena habitó la región austral del Ecuador antes de los incas?", opts:["Cañari","Chibcha","Tolteca","Guaraní"], correct:0},
  {region:'insular', q:"¿Aproximadamente cuántas provincias tiene el Ecuador?", opts:["18","20","24","30"], correct:2},
  {region:'insular', q:"¿Qué naturalista británico visitó las Islas Galápagos y desarrolló ideas clave sobre la evolución?", opts:["Charles Darwin","Alexander von Humboldt","Isaac Newton","Louis Pasteur"], correct:0},
  {region:'insular', q:"¿Qué animal es un símbolo característico de las Islas Galápagos?", opts:["El jaguar","La tortuga gigante","El oso de anteojos","El cóndor"], correct:1}
];

let playerName = "";
let quiz = [];
let current = 0;
let points = 0;
let correctCount = 0;
const QUESTIONS_PER_GAME = 12;
const hasStorage = typeof window.storage !== 'undefined';

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildQuiz(){
  const byRegion = {costa:[], sierra:[], amazonia:[], insular:[]};
  POOL.forEach(q=>byRegion[q.region].push(q));
  let picked = [];
  REGIONS.forEach(r=>{
    picked = picked.concat(shuffle(byRegion[r.id]).slice(0,3));
  });
  return picked.map(q=>{
    const optsWithIdx = q.opts.map((text,i)=>({text, isCorrect:i===q.correct}));
    const shuffled = shuffle(optsWithIdx);
    return {region:q.region, q:q.q, options:shuffled};
  });
}

function startGame(){
  const val = document.getElementById('nameInput').value.trim();
  if(!val){ document.getElementById('nameInput').focus(); return; }
  playerName = val;
  quiz = buildQuiz();
  current = 0; points = 0; correctCount = 0;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  document.getElementById('playerLabel').textContent = playerName;
  renderRoute();
  renderQuestion();
  syncScore();
}

function renderRoute(){
  const box = document.getElementById('route');
  box.innerHTML = '';
  const stopIndex = Math.min(Math.floor(current/3), 3);
  REGIONS.forEach((r,i)=>{
    const div = document.createElement('div');
    div.className = 'stop' + (i===stopIndex ? ' active' : (i<stopIndex ? ' done' : ''));
    div.innerHTML = `<span class="icon">${ICONS[r.id]}</span><span class="name">${r.label}</span>`;
    box.appendChild(div);
  });
}

function renderQuestion(){
  if(current >= QUESTIONS_PER_GAME){ finishGame(); return; }
  const item = quiz[current];
  document.getElementById('qCounter').textContent = `Pregunta ${current+1} / ${QUESTIONS_PER_GAME}`;
  document.getElementById('qRegion').textContent = REGIONS.find(r=>r.id===item.region).label;
  document.getElementById('qText').textContent = item.q;
  document.getElementById('pointsLabel').textContent = `${points} pts`;
  document.getElementById('feedback').textContent = '';
  const box = document.getElementById('optionsBox');
  box.innerHTML = '';
  item.options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt.text;
    btn.onclick = ()=> answer(opt.isCorrect, btn);
    box.appendChild(btn);
  });
  renderRoute();
}

function answer(isCorrect, btnEl){
  const buttons = document.querySelectorAll('#optionsBox .opt');
  buttons.forEach(b=>b.disabled = true);
  if(isCorrect){
    btnEl.classList.add('correct');
    points += 10;
    correctCount++;
    document.getElementById('feedback').textContent = '¡Correcto! +10 puntos';
  } else {
    btnEl.classList.add('wrong');
    document.getElementById('feedback').textContent = 'No era esa. ¡Sigue la ruta!';
  }
  document.getElementById('pointsLabel').textContent = `${points} pts`;
  syncScore();
  setTimeout(()=>{ current++; renderQuestion(); }, 900);
}

function rankFor(pts){
  if(pts >= 110) return ["Guardián de las 4 Regiones","Dominaste Costa, Sierra, Amazonía e Insular."];
  if(pts >= 80) return ["Explorador Nacional","Muy buen manejo de la geografía y la historia del Ecuador."];
  if(pts >= 50) return ["Viajero en Ruta","Vas bien, pero aún hay territorio por explorar."];
  return ["Aprendiz de Expedición","Buen comienzo, repasa y vuelve a intentarlo."];
}

function finishGame(){
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.remove('hidden');
  const [title, desc] = rankFor(points);
  document.getElementById('rankTitle').textContent = title;
  document.getElementById('rankDesc').textContent = desc;
  document.getElementById('finalCorrect').textContent = `${correctCount}/${QUESTIONS_PER_GAME}`;
  document.getElementById('finalPoints').textContent = points;
  syncScore(true);
}

async function syncScore(finished){
  if(!hasStorage) return;
  try{
    let board = {};
    try{
      const res = await window.storage.get('estudios-sociales-leaderboard', true);
      board = JSON.parse(res.value);
    }catch(e){ board = {}; }
    board[playerName] = { points, progress: current, finished: !!finished, ts: Date.now() };
    await window.storage.set('estudios-sociales-leaderboard', JSON.stringify(board), true);
  }catch(e){ /* silently ignore, game keeps working locally */ }
}

async function refreshLeaderboard(){
  const list = document.getElementById('lbList');
  const note = document.getElementById('offlineNote');
  if(!hasStorage){
    note.textContent = 'El marcador en vivo no está disponible fuera de este visor; cada quien juega en su dispositivo y comparte su puntaje final con el curso.';
    list.innerHTML = '';
    return;
  }
  try{
    const res = await window.storage.get('estudios-sociales-leaderboard', true);
    const board = JSON.parse(res.value);
    const rows = Object.entries(board).sort((a,b)=>b[1].points - a[1].points);
    list.innerHTML = rows.length ? '' : '<div class="offline-note">Nadie ha empezado todavía.</div>';
    rows.forEach(([name, data], i)=>{
      const row = document.createElement('div');
      row.className = 'lb-row';
      const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`;
      row.innerHTML = `<span class="lb-rank">${medal}</span><span class="lb-name">${name}</span><span class="lb-pts">${data.points} pts</span>`;
      list.appendChild(row);
    });
    note.textContent = '';
  }catch(e){
    list.innerHTML = '<div class="offline-note">Aún no hay puntajes registrados.</div>';
  }
}

let lbInterval = null;
function openLeaderboard(){
  document.getElementById('lbPanel').classList.add('open');
  refreshLeaderboard();
  lbInterval = setInterval(refreshLeaderboard, 4000);
}
function closeLeaderboard(){
  document.getElementById('lbPanel').classList.remove('open');
  clearInterval(lbInterval);
}
if(!hasStorage){ document.getElementById('lbToggle').textContent = '🏆 Marcador (sin conexión)'; }

let qrRendered = false;
function openQR(){
  document.getElementById('qrPanel').classList.add('open');
  document.getElementById('qrUrlText').textContent = window.location.href;
  if(!qrRendered){
    try{
      new QRCode(document.getElementById('qrBox'), {
        text: window.location.href,
        width: 220,
        height: 220,
        colorDark: '#0b241a',
        colorLight: '#ffffff'
      });
      qrRendered = true;
    }catch(e){
      document.getElementById('qrBox').textContent = 'No se pudo generar el QR. Comparte el enlace directamente.';
    }
  }
}
function closeQR(){
  document.getElementById('qrPanel').classList.remove('open');
}
</script>
</body>
</html>
